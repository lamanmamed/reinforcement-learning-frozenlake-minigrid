[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reinforcement-learning-frozenlake-minigrid"
version = "0.1.0"
description = "Reinforcement learning experiments from FrozenLake dynamic programming to recurrent PPO on MiniGrid"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "torch>=2.0",
]

[project.optional-dependencies]
minigrid = [
    "gymnasium>=1.0",
    "minigrid>=3.0",
    "stable-baselines3>=2.7",
    "sb3-contrib>=2.7",
    "pygame>=2.6",
    "tensorboard>=2.15",
]

[tool.setuptools.packages.find]
where = ["src"]
